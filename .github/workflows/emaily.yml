name: Emaily (online a spravy)

# Každých 10 minút: e-maily „film je online“ a „nová správa“.
on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

jobs:
  odoslat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Spustit odesilani
        run: |
          code=$(curl -s -o odpoved.json -w "%{http_code}" -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/emails")
          cat odpoved.json; echo
          test "$code" = "200"
